[versions]
agp = "8.8.2"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
appcompat = "1.7.0"
room = "2.6.1"
junit = "4.13.2"
# 차량·위치·음성 검증 화면에서 쓰는 Pleos SDK 버전
pleosVehicle = "2.3.2"
pleosNavi = "3.0.5"
pleosLocation = "1.1.3"
pleosStt = "3.3.1"
pleosTts = "3.3.1"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-navihelper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNavi" }
pleos-fusedlocation = { group = "ai.pleos.playground", name = "FusedLocation", version.ref = "pleosLocation" }
pleos-stt = { group = "ai.pleos.playground", name = "SpeechToText", version.ref = "pleosStt" }
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "pleosTts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
